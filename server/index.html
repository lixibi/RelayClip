<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextSync</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --label: #64748b;
            --border: #e2e8f0;
            --primary: #3b82f6;
            --success: #22c55e;
            --accent: #64748b;
        }
        
        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #1e2937;
            --text: #e2e8f0;
            --label: #94a3b8;
            --border: #334155;
            --primary: #60a5fa;
            --success: #4ade80;
            --accent: #cbd5e1;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            overflow-x: hidden;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            line-height: 1.5;
            transition: background 0.3s;
            overflow-x: hidden;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h1 {
            margin: 0 0 24px 0;
            font-size: 26px;
            text-align: center;
            color: var(--primary);
            font-weight: 600;
        }
        .label {
            font-size: 14px;
            color: var(--label);
            margin-bottom: 8px;
            font-weight: 500;
        }
        #latest {
            font-size: 18px;
            background: var(--bg);
            padding: 18px;
            border-radius: 10px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            min-height: 64px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            color: var(--text);
        }
        button {
            padding: 14px 20px;
            margin: 6px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
        }
        .btn-copy {
            background: var(--primary);
            color: white;
        }
        .btn-update {
            background: var(--success);
            color: white;
        }
        .btn-paste {
            background: var(--accent);
            color: white;
            width: auto;
            padding: 14px 18px;
            flex: 0 0 auto;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        textarea {
            width: 100%;
            padding: 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 16px;
            margin-bottom: 12px;
            min-height: 140px;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
            line-height: 1.5;
            white-space: pre-wrap;
            min-width: 0;
            flex: 1 1 auto;
        }
        .history-item {
            background: var(--bg);
            padding: 12px 14px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 15px;
            border: 1px solid var(--border);
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        @media (max-width: 420px) {
            body {
                padding: 12px;
            }
            .card {
                padding: 16px;
            }
            .input-row {
                flex-direction: column;
            }
            .btn-paste {
                width: 100%;
            }
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 9999px;
            font-size: 15px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            display: none;
            z-index: 100;
        }
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">☀️</div>
    
    <h1>TextSync</h1>

    <!-- 第一张卡片：最新文本 -->
    <div class="card">
        <div class="label">最新文本</div>
        <div id="latest">加载中...</div>
        <button class="btn-copy" id="copyBtn">📋 复制</button>
    </div>

    <!-- 第二张卡片：更新文本 -->
    <div class="card">
        <div class="label">更新文本</div>
        <div class="input-row">
            <textarea id="input" placeholder="输入或粘贴新内容..."></textarea>
            <button class="btn-paste" id="pasteBtn">📋</button>
        </div>
        <button class="btn-update" id="updateBtn">更新</button>
    </div>

    <!-- 历史记录 -->
    <div class="card">
        <div class="label">历史记录</div>
        <div id="history"></div>
    </div>

    <div id="toast" class="toast">更新成功</div>

    <script>
        let isDark = localStorage.getItem('theme') === 'dark';
        const body = document.body;
        const toggleBtn = document.getElementById('themeToggle');

        function applyTheme() {
            if (isDark) {
                body.setAttribute('data-theme', 'dark');
                toggleBtn.textContent = '☽';
            } else {
                body.removeAttribute('data-theme');
                toggleBtn.textContent = '☀️';
            }
        }

        toggleBtn.addEventListener('click', () => {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            applyTheme();
        });

        // 初始化主题
        applyTheme();

        async function load() {
            try {
                let res = await fetch('/api/list');
                let data = await res.json();
                if (data.length === 0) {
                    document.getElementById('latest').textContent = '暂无数据';
                    return;
                }

                let latest = data[data.length-1];
                document.getElementById('latest').textContent = latest.content || '';

                const history = document.getElementById('history');
                history.textContent = '';
                for (let item of data.slice().reverse().slice(0, 8)) {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.textContent = item.content || '';
                    history.appendChild(div);
                }
            } catch(e) {
                document.getElementById('latest').textContent = '加载失败';
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = isError ? '#ef4444' : 'var(--success)';
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        // 复制（兼容 iOS Safari）
        document.getElementById('copyBtn').addEventListener('click', () => {
            const text = document.getElementById('latest').textContent;
            if (!text || text === '加载中...' || text === '加载失败') return;

            copyToClipboard(text);
        });

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('已复制到剪贴板');
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('已复制到剪贴板');
                } catch (e) {
                    showToast('长按文本手动复制', true);
                }
                document.body.removeChild(ta);
            }
        }

        // 粘贴
        document.getElementById('pasteBtn').addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('input').value = text;
                showToast('已粘贴');
            } catch(e) {
                showToast('无法读取剪贴板', true);
            }
        });

        // 更新
        document.getElementById('updateBtn').addEventListener('click', async () => {
            const input = document.getElementById('input');
            const val = input.value;
            if (!val.trim()) return;

            try {
                const res = await fetch('/api/post', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain; charset=utf-8'
                    },
                    body: val
                });
                if (!res.ok) throw new Error(await res.text());
                input.value = '';
                showToast('更新成功');
                load();
            } catch(e) {
                showToast('更新失败', true);
            }
        });

        // Ctrl/Cmd+Enter 提交，普通 Enter 保留为换行。
        document.getElementById('input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                document.getElementById('updateBtn').click();
            }
        });

        // 启动
        load();
        setInterval(load, 7000);
    </script>
</body>
</html>
