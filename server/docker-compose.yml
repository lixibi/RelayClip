version: '3.8'

services:
  relayclip-server:
    build: .
    image: ghcr.io/lixibi/relayclip-server:latest
    container_name: relayclip-server
    ports:
      - "17006:8080"
    volumes:
      - relayclip-data:/data
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - KEYSERVER_DATA_FILE=/data/keys.json

volumes:
  relayclip-data:
