version: '3.8'

services:
  textsync-server:
    build: .
    image: ghcr.io/lixibi/textsync-server:latest
    container_name: textsync-server
    ports:
      - "17006:8080"
    volumes:
      - textsync-data:/data
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - KEYSERVER_DATA_FILE=/data/keys.json

volumes:
  textsync-data:
