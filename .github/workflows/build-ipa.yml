name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project SkylineNotes.xcodeproj \
            -scheme SkylineNotes \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/Products/Release-iphoneos/SkylineNotes.app" -type d | head -n 1)"
          test -n "$APP_PATH"
          rm -rf Payload SkylineNotes.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry SkylineNotes.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SkylineNotes-ipa
          path: SkylineNotes.ipa
