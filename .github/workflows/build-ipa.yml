name: TextSync CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: ghcr.io/lixibi/textsync-server

permissions:
  contents: write
  packages: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project TextSync.xcodeproj \
            -scheme TextSync \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/Products/Release-iphoneos/TextSync.app" -type d | head -n 1)"
          test -n "$APP_PATH"
          rm -rf Payload TextSync.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry TextSync.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TextSync-ipa
          path: TextSync.ipa

      - name: Publish latest IPA release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          app_path="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/Products/Release-iphoneos/TextSync.app" -type d | head -n 1)"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          version_tag="ios-v${version}-${build}"
          latest_tag="latest-ipa"
          previous_tag="$(git describe --tags --match 'ios-v*' --abbrev=0 HEAD^ 2>/dev/null || true)"

          {
            echo "版本：${version} (${build})"
            echo
            echo "更新说明："
            if [ -n "$previous_tag" ]; then
              git log --pretty='- %s (%h)' "${previous_tag}..HEAD"
            else
              git log -1 --pretty='- %s (%h)'
            fi
            echo
            echo "提交：${GITHUB_SHA}"
          } > RELEASE_NOTES.md

          git tag -f "$version_tag" "$GITHUB_SHA"
          git tag -f "$latest_tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$version_tag" "refs/tags/$latest_tag"

          if gh release view "$version_tag" >/dev/null 2>&1; then
            gh release edit "$version_tag" --title "TextSync ${version} (${build})" --notes-file RELEASE_NOTES.md
          else
            gh release create "$version_tag" --title "TextSync ${version} (${build})" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$version_tag" TextSync.ipa --clobber

          if gh release view "$latest_tag" >/dev/null 2>&1; then
            gh release edit "$latest_tag" --title "Latest TextSync IPA" --notes-file RELEASE_NOTES.md
          else
            gh release create "$latest_tag" --title "Latest TextSync IPA" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$latest_tag" TextSync.ipa --clobber

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect server changes
        id: server_changes
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- server; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.server_changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.server_changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server image
        if: steps.server_changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
